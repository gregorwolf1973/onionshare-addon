name: OnionShare
version: "0.1.3"
slug: onionshare
description: Share & receive files, host websites and chat anonymously via Tor
url: https://github.com/gregorwolf1973/onionshare-addon
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:onepassword
panel_title: OnionShare
hassio_api: false
homeassistant_api: false
host_network: false
map:
  - share:rw
  - media:rw
  - backup:ro
  - config:rw
ports:
  9050/tcp: null
  9051/tcp: null
options:
  log_level: info
  persistent_onions: true
  bridges_enabled: false
  bridges: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  persistent_onions: bool
  bridges_enabled: bool
  bridges: str
